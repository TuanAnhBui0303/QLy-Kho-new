<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Quản Trị</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card">
            <h3 style="text-align: center;">🔐 ĐĂNG NHẬP ADMIN</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>Tài khoản:</label>
                    <input type="text" id="username" placeholder="Nhập admin" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="password" placeholder="Nhập 123456" required>
                </div>
                <button type="submit" class="btn-primary">Đăng Nhập</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                <a href="TrangChu.html">← Quay lại trang chủ</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
